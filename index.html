<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aviatrix 3D Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; height: 100vh; overflow: hidden; }

        /* پاشبنەمای جوڵاو (ئەنیمەیشن) */
        .game-viewport { 
            flex: 1; position: relative; 
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%); 
            overflow: hidden; display: flex; align-items: center; justify-content: center; 
        }

        /* ئەنیمەیشنی لەرینەوەی فڕۆکە (3D Effect) */
        @keyframes float {
            0% { transform: translateY(0px) rotate(-10deg); }
            50% { transform: translateY(-10px) rotate(-8deg); }
            100% { transform: translateY(0px) rotate(-10deg); }
        }

        /* ئەنیمەیشنی ئاگری پشت فڕۆکە */
        .engine-fire {
            position: absolute; right: -20px; top: 50%;
            width: 40px; height: 15px;
            background: linear-gradient(to left, transparent, #ff4500, #ffae00);
            border-radius: 50%; filter: blur(5px);
            opacity: 0; animation: flicker 0.1s infinite;
        }
        @keyframes flicker { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        .plane-box { 
            position: absolute; bottom: 20%; left: 15%; width: 150px; z-index: 5;
            animation: float 3s ease-in-out infinite;
        }
        .plane-box img { width: 100%; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6)); }

        .multiplier { font-size: 5.5rem; font-weight: 900; z-index: 10; font-style: italic; color: #fff; text-shadow: 0 0 30px rgba(151, 88, 255, 0.8); }

        /* دیزاینی داشبۆرد و دوگمەکان وەک وێنە فەرمییەکە */
        .dashboard { background: #161721; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid #2a2c3d; }
        .bet-panel { background: #20212e; border-radius: 20px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #313345; }
        
        .amount-box { background: #0c0d12; border-radius: 12px; padding: 10px; text-align: center; color: #ffb800; font-weight: bold; font-size: 1.4rem; border: 1px solid #313345; }
        
        .bet-btn { 
            background: linear-gradient(180deg, #2855f5 0%, #1a3ab3 100%); 
            color: white; border: none; padding: 16px; border-radius: 15px; 
            font-weight: 900; font-size: 1.2rem; cursor: pointer;
        }
        .bet-btn.cashout { background: linear-gradient(180deg, #ff9d00 0%, #e68a00 100%); color: #000; }

        .flew-away { color: #ff3366 !important; animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(5px); } 50% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="multiplier" id="display">1.00x</div>
        <div class="plane-box" id="plane">
            <div class="engine-fire" id="fire"></div>
            <img src="https://i.ibb.co/LzNfV9m/fighter-jet.png" id="jet-img">
        </div>
    </div>

    <div class="dashboard">
        <div class="bet-panel">
            <div class="amount-box">100</div>
            <button class="bet-btn" id="btn1" onclick="handleBet(this)">بەستن (BET)</button>
        </div>
        <div class="bet-panel">
            <div class="amount-box">100</div>
            <button class="bet-btn" id="btn2" onclick="handleBet(this)">بەستن (BET)</button>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let isRunning = false;
        let interval;
        const display = document.getElementById('display');
        const plane = document.getElementById('plane');
        const fire = document.getElementById('fire');

        function handleBet(btn) {
            if (btn.innerText.includes("بەستن")) {
                btn.innerText = "وەرگرتن (CASH OUT)";
                btn.classList.add('cashout');
                if(!isRunning) startGame();
            } else {
                resetGame(btn);
            }
        }

        function startGame() {
            isRunning = true;
            multiplier = 1.00;
            display.classList.remove('flew-away');
            fire.style.opacity = "1"; // ئاگرەکە دادەگیرسێت
            
            interval = setInterval(() => {
                multiplier += 0.01;
                display.innerText = multiplier.toFixed(2) + "x";
                
                let pos = (multiplier - 1) * 40;
                plane.style.transform = `translate(${pos}px, -${pos}px)`;

                if (Math.random() < 0.005 && multiplier > 1.5) {
                    crash();
                }
            }, 100);
        }

        function crash() {
            clearInterval(interval);
            isRunning = false;
            fire.style.opacity = "0";
            display.innerText = "فڕۆکە فڕی!";
            display.classList.add('flew-away');
            setTimeout(() => {
                resetGame(document.getElementById('btn1'));
                resetGame(document.getElementById('btn2'));
            }, 2000);
        }

        function resetGame(btn) {
            btn.innerText = "بەستن (BET)";
            btn.classList.remove('cashout');
            if(!isRunning) {
                multiplier = 1.00;
                display.innerText = "1.00x";
                plane.style.transform = `translate(0, 0)`;
            }
        }

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
