<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Kurdi Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #0f0f1a; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* شاشەیا یارییێ */
        .game-area { flex: 1; position: relative; background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 2px solid #252538; }
        
        .multiplier { font-size: 4rem; font-weight: 900; z-index: 10; font-style: italic; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        
        /* فڕۆکەیا نوی یا پاقژ */
        .plane { position: absolute; bottom: 20%; left: 10%; width: 100px; z-index: 5; transition: transform 0.1s linear; }
        .plane img { width: 100%; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }

        /* پەنەلا دوگمەیان */
        .controls { background: #161625; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .bet-card { background: #1f1f2e; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #2d2d44; }
        
        .val-box { background: #000; border-radius: 8px; padding: 10px; text-align: center; color: #ffb800; font-size: 1.2rem; font-weight: bold; }
        
        .btn-bet { background: #2855f5; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-bet.active { background: #ff9d00; color: #000; }
        
        .flew { color: #ff3366 !important; }
    </style>
</head>
<body>

    <div class="game-area">
        <div class="multiplier" id="m-text">1.00x</div>
        <div class="plane" id="plane-box">
            <img src="https://raw.githubusercontent.com/fbeeper/fbeeper.github.io/master/aviator-plane.png" alt="plane">
        </div>
    </div>

    <div class="controls">
        <div class="bet-card">
            <div class="val-box">100</div>
            <button class="btn-bet" onclick="toggleBet(this)">بەستن (BET)</button>
        </div>
        <div class="bet-card">
            <div class="val-box">100</div>
            <button class="btn-bet" onclick="toggleBet(this)">بەستن (BET)</button>
        </div>
    </div>

    <script>
        let m = 1.00;
        let flying = false;
        let timer;
        const mText = document.getElementById('m-text');
        const plane = document.getElementById('plane-box');

        function toggleBet(btn) {
            if (btn.innerText.includes("بەستن")) {
                btn.innerText = "CASH OUT";
                btn.classList.add('active');
                if(!flying) start();
            } else {
                reset(btn);
            }
        }

        function start() {
            flying = true;
            m = 1.00;
            mText.classList.remove('flew');
            timer = setInterval(() => {
                m += 0.01;
                mText.innerText = m.toFixed(2) + "x";
                let p = (m - 1) * 30;
                plane.style.transform = `translate(${p}px, -${p}px)`;
                if (Math.random() < 0.007 && m > 1.3) crash();
            }, 100);
        }

        function crash() {
            clearInterval(timer);
            flying = false;
            mText.innerText = "فڕۆکە فڕی!";
            mText.classList.add('flew');
            setTimeout(() => {
                document.querySelectorAll('.btn-bet').forEach(b => reset(b));
            }, 2000);
        }

        function reset(btn) {
            btn.innerText = "بەستن (BET)";
            btn.classList.remove('active');
            if(!flying) {
                m = 1.00;
                mText.innerText = "1.00x";
                plane.style.transform = `translate(0, 0)`;
            }
        }
    </script>
</body>
</html>
