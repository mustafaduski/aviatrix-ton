<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aviatrix Kurdi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #1b1229; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* شاشەیا یارییێ */
        .game-viewport { flex: 1; position: relative; background: radial-gradient(circle at center, #2e1f4d 0%, #120b1e 100%); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* ژمارەیا گەورە */
        .multiplier { font-size: 5rem; font-weight: 900; z-index: 10; font-style: italic; color: white; text-shadow: 0 0 20px rgba(151, 88, 255, 0.6); }
        
        /* فڕۆکەیا جەنگی */
        .plane-box { position: absolute; bottom: 20%; left: 10%; width: 120px; z-index: 5; transition: transform 0.1s linear; }
        .plane-box img { width: 100%; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }

        /* بەشێ کۆنترۆڵێ */
        .dashboard { background: #251b36; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 2px solid #3d2d57; padding-bottom: 25px; }
        .bet-panel { background: #2d2444; border-radius: 15px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #3d2d57; }
        
        .input-group { display: flex; align-items: center; justify-content: space-between; background: #1b1229; border-radius: 10px; padding: 8px 15px; }
        .amount { color: #ffb800; font-weight: bold; font-size: 1.3rem; }
        
        .quick-bets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .q-btn { background: #3d3357; border: none; color: #b5aed4; padding: 8px 0; border-radius: 8px; font-size: 0.9rem; font-weight: bold; }
        
        /* دوگمەیێن کوردی */
        .bet-btn { background: #2855f5; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .bet-btn.cashout { background: #ff9d00; color: #1b1229; }
        
        .history { position: absolute; bottom: 10px; width: 100%; display: flex; gap: 8px; padding: 0 15px; overflow: hidden; justify-content: center; }
        .h-item { font-size: 0.8rem; padding: 3px 10px; border-radius: 10px; background: rgba(0,0,0,0.3); font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="multiplier" id="display">1.00x</div>
        <div class="plane-box" id="plane">
            <img src="https://i.ibb.co/LzNfV9m/fighter-jet.png" alt="plane">
        </div>
        <div class="history">
            <div class="h-item" style="color:#9758ff">2.45x</div>
            <div class="h-item" style="color:#34b3ff">1.15x</div>
            <div class="h-item" style="color:#ff3471">10.2x</div>
            <div class="h-item" style="color:#ffffff">1.50x</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="bet-panel">
            <div class="input-group">
                <span>+</span> <span class="amount">100</span> <span>−</span>
            </div>
            <div class="quick-bets">
                <button class="q-btn">1</button><button class="q-btn">2</button>
                <button class="q-btn">5</button><button class="q-btn">10</button>
            </div>
            <button class="bet-btn" id="btn1" onclick="handleBet(this)">بەستن (BET)</button>
        </div>

        <div class="bet-panel">
            <div class="input-group">
                <span>+</span> <span class="amount">100</span> <span>−</span>
            </div>
            <div class="quick-bets">
                <button class="q-btn">1</button><button class="q-btn">2</button>
                <button class="q-btn">5</button><button class="q-btn">10</button>
            </div>
            <button class="bet-btn" id="btn2" onclick="handleBet(this)">بەستن (BET)</button>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let running = false;
        let gameInterval;
        const display = document.getElementById('display');
        const plane = document.getElementById('plane');

        function handleBet(btn) {
            if (btn.innerText.includes("بەستن")) {
                btn.innerText = "وەرگرتن (CASH OUT)";
                btn.classList.add('cashout');
                if(!running) startGame();
            } else {
                window.Telegram.WebApp.showConfirm("تە " + multiplier.toFixed(2) + "x قازانج کر!");
                resetGame(btn);
            }
        }

        function startGame() {
            running = true;
            multiplier = 1.00;
            display.style.color = "white";
            
            gameInterval = setInterval(() => {
                multiplier += 0.01;
                display.innerText = multiplier.toFixed(2) + "x";
                
                let move = (multiplier - 1) * 35;
                plane.style.transform = `translate(${move}px, -${move}px)`;

                if (Math.random() < 0.006 && multiplier > 1.2) {
                    crash();
                }
            }, 100);
        }

        function crash() {
            clearInterval(gameInterval);
            running = false;
            display.style.color = "#ff3471";
            display.innerText = "فڕۆکە فڕی!";
            setTimeout(() => {
                resetGame(document.getElementById('btn1'));
                resetGame(document.getElementById('btn2'));
            }, 2000);
        }

        function resetGame(btn) {
            btn.innerText = "بەستن (BET)";
            btn.classList.remove('cashout');
            if(!running) {
                multiplier = 1.00;
                display.innerText = "1.00x";
                display.style.color = "white";
                plane.style.transform = `translate(0, 0)`;
            }
        }

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
