<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix PRO - TON</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --accent: #7d5fff; --bg: #0b0e11; --panel: #1b2129; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        #header { display: flex; justify-content: space-between; padding: 12px; background: var(--panel); align-items: center; border-bottom: 2px solid #2d3436; }
        .balance-box { background: #000; padding: 8px 15px; border-radius: 12px; border: 1px solid var(--accent); color: #00d2ff; font-weight: bold; }
        #game-view { height: 50vh; position: relative; background: radial-gradient(circle, #1e272e 0%, #0b0e11 100%); overflow: hidden; }
        #multiplier { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 4.5rem; font-weight: 900; }
        #plane { position: absolute; width: 70px; bottom: 15%; left: 10%; z-index: 10; transition: transform 0.1s linear; }
        #controls { padding: 20px; background: var(--panel); border-radius: 25px 25px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input { background: #000; border: 1px solid #3d444b; color: white; padding: 15px; border-radius: 12px; text-align: center; font-size: 1.2rem; }
        #actionBtn { background: #00b894; border: none; color: white; border-radius: 12px; font-weight: bold; font-size: 1.4rem; cursor: pointer; }
        #actionBtn.stop { background: #d63031; }
        .footer-info { grid-column: span 2; font-size: 0.75rem; color: #888; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="header">
        <div class="balance-box">Balance: <span id="balance">100.00</span> TON</div>
        <div id="ton-connect"></div>
    </div>
    <div id="game-view">
        <div id="multiplier">1.00x</div>
        <img id="plane" src="https://raw.githubusercontent.com/TelegramGameBot/assets/main/plane.png">
    </div>
    <div id="controls">
        <input type="number" id="betAmount" value="1.0">
        <button id="actionBtn">BET</button>
        <div class="footer-info">
            Deposit to (TON): <br>
            <b style="color:#7d5fff;".UQAinxO5Eym0OB4mHquKX1UIpLeK9gdb6OuKrdZE6v63NgPH</b>
        </div>
    </div>

    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        let multiplier = 1.00, isFlying = false, balance = 100.00;
        const btn = document.getElementById('actionBtn'), plane = document.getElementById('plane'), multDisplay = document.getElementById('multiplier');

        btn.onclick = () => {
            if(!isFlying) {
                let bet = parseFloat(document.getElementById('betAmount').value);
                if(balance >= bet) { balance -= bet; document.getElementById('balance').innerText = balance.toFixed(2); startFlight(); }
                else { alert("Check Balance!"); }
            } else { cashOut(); }
        };

        function startFlight() {
            isFlying = true; multiplier = 1.00; btn.innerText = "CASH OUT"; btn.classList.add('stop');
            let loop = setInterval(() => {
                if(!isFlying) { clearInterval(loop); return; }
                multiplier += 0.01; multDisplay.innerText = multiplier.toFixed(2) + "x";
                let pos = (multiplier - 1) * 25;
                plane.style.transform = translate(${pos}px, -${pos}px) rotate(-15deg);
                if(Math.random() < 0.006) { crash(); clearInterval(loop); }
            }, 60);
        }

        function cashOut() {
            balance += parseFloat(document.getElementById('betAmount').value) * multiplier;
            document.getElementById('balance').innerText = balance.toFixed(2);
            isFlying = false; reset();
        }

        function crash() { isFlying = false; multDisplay.innerText = "CRASH!"; reset(); }
        function reset() { btn.innerText = "BET"; btn.classList.remove('stop'); setTimeout(() => { multiplier = 1.00; multDisplay.innerText = "1.00x"; plane.style.transform = "none"; }, 2000); }
    </script>
</body>
</html>
