<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Professional Clone</title>
    <style>
        :root { --main-bg: #0c0d12; --accent: #2855f5; --gold: #ffb500; }
        body { margin: 0; background: var(--main-bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        
        /* شاشەی فڕین - ڕێک وەک وێنە ئەسڵییەکە */
        .viewport { 
            position: relative; height: 60vh; 
            background: radial-gradient(circle at bottom left, #1e213a, #0c0d12); 
            border-bottom: 2px solid #232635;
        }

        .multiplier { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 5.5rem; font-weight: 900; z-index: 10; font-style: italic;
            text-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* هێڵە زەردە چەماوەکە */
        .chart-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        
        .plane { 
            position: absolute; bottom: 20%; left: 10%; width: 140px; z-index: 5;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        /* بەشی گرەوکردن */
        .bet-area { 
            height: 40vh; background: #0f111a; padding: 15px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .bet-card { 
            background: #1c1f2e; border-radius: 20px; padding: 15px; 
            border: 1px solid #2d3045; display: flex; flex-direction: column; justify-content: space-between;
        }
        .bet-btn { 
            background: linear-gradient(180deg, var(--accent), #1a3ab3); 
            border: none; color: white; padding: 18px; border-radius: 14px; 
            font-weight: 900; font-size: 1.2rem; cursor: pointer;
        }
        .bet-btn.active { background: linear-gradient(180deg, var(--gold), #e68a00); color: black; }
    </style>
</head>
<body>

    <div class="viewport">
        <div class="multiplier" id="mult-text">1.00x</div>
        <svg class="chart-svg">
            <path id="graph-path" d="M 0 500 Q 0 500 0 500" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" />
        </svg>
        <div class="plane" id="plane-obj">
            <img src="https://raw.githubusercontent.com/fbeeper/fbeeper.github.io/master/aviator-plane.png" width="100%">
        </div>
    </div>

    <div class="bet-area">
        <div class="bet-card">
            <div style="text-align:center; font-size: 1.5rem; color: var(--gold); font-weight:bold;">100 TON</div>
            <button class="bet-btn" onclick="toggleBet(this)">PLACE BET</button>
        </div>
        <div class="bet-card">
            <div style="text-align:center; font-size: 1.5rem; color: var(--gold); font-weight:bold;">100 TON</div>
            <button class="bet-btn" onclick="toggleBet(this)">PLACE BET</button>
        </div>
    </div>

    <script>
        let m = 1.00; let flying = false; let loop;
        const mText = document.getElementById('mult-text');
        const plane = document.getElementById('plane-obj');
        const path = document.getElementById('graph-path');

        function toggleBet(btn) {
            if (btn.innerText === "PLACE BET") {
                btn.innerText = "CASH OUT"; btn.classList.add('active');
                if (!flying) startRound();
            } else {
                alert("تە " + (100 * m).toFixed(2) + " TON قازانج کرد!");
                btn.innerText = "PLACE BET"; btn.classList.remove('active');
            }
        }

        function startRound() {
            flying = true; m = 1.00;
            const h = document.querySelector('.viewport').offsetHeight;
            loop = setInterval(() => {
                m += 0.01;
                mText.innerText = m.toFixed(2) + "x";
                
                let x = (m - 1) * 55;
                let y = (m - 1) * 45;
                plane.style.transform = `translate(${x}px, -${y}px)`;
                
                // نوێکردنەوەی هێڵە زەردە کێرڤەکە
                path.setAttribute('d', `M 0 ${h*0.8} Q ${x} ${h*0.8} ${x+60} ${h*0.8-y}`);

                // لۆژیکی تەقینەوە
                if (Math.random() < 0.007 && m > 1.3) {
                    clearInterval(loop); flying = false;
                    mText.innerText = "FLEW AWAY!";
                    plane.style.transition = "0.5s";
                    plane.style.transform = `translate(${x+500}px, -${y+400}px) scale(0)`;
                    setTimeout(() => location.reload(), 2000);
                }
            }, 100);
        }
    </script>
</body>
</html>
