<!DOCTYPE html>
<html lang="ku" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aviatrix Mobile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #1b1229; color: white; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* شاشەیا سەرەکی یا یارییێ */
        .game-viewport { flex: 1; position: relative; background: linear-gradient(to bottom, #4a3469 0%, #1b1229 100%); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* گرافیکێ ئەسمانی و هەوران */
        .clouds { position: absolute; width: 200%; height: 100%; background: url('https://i.imgur.com/8X8G9kS.png') repeat-x; opacity: 0.2; animation: moveClouds 20s linear infinite; bottom: 0; }
        @keyframes moveClouds { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* مولتیپلایەر (ژمارە) */
        .multiplier { font-size: 4.5rem; font-weight: 850; z-index: 10; font-style: italic; color: white; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        
        /* فڕۆکەیا پڕۆفیشناڵ */
        .plane-box { position: absolute; bottom: 20%; left: 10%; width: 140px; z-index: 5; transition: transform 0.1s linear; }
        .plane-box img { width: 100%; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); }

        /* بەشێ کۆنترۆڵێ (Dashboard) */
        .dashboard { background: #251b36; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 2px solid #3d2d57; }
        .bet-panel { background: #2d2444; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        
        .input-group { display: flex; align-items: center; justify-content: space-between; background: #1b1229; border-radius: 8px; padding: 5px 10px; border: 1px solid #4a3b69; }
        .amount { color: #ffb800; font-weight: bold; font-size: 1.2rem; }
        
        .quick-bets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .q-btn { background: #3d3357; border: none; color: #b5aed4; padding: 6px 0; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        
        /* دوگمەیا مەزن یا Bet */
        .bet-btn { background: #2855f5; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; cursor: pointer; }
        .bet-btn.cashout { background: #ff9d00; }
        
        .auto-row { display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 0.75rem; color: #8e85a8; }
        
        /* مێژوو ل خوارێ */
        .history { position: absolute; bottom: 5px; width: 100%; display: flex; gap: 5px; padding: 0 10px; overflow: hidden; opacity: 0.7; }
        .h-item { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: #1b1229; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="clouds"></div>
        <div class="multiplier" id="display">1.00x</div>
        <div class="plane-box" id="plane">
            <img src="https://i.ibb.co/LzNfV9m/fighter-jet.png" alt="plane">
        </div>
        <div class="history">
            <div class="h-item" style="color:#9758ff">2.45x</div>
            <div class="h-item" style="color:#34b3ff">1.15x</div>
            <div class="h-item" style="color:#ff3471">10.2x</div>
            <div class="h-item" style="color:#ffffff">1.50x</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="bet-panel">
            <div class="input-group">
                <span style="color:#8e85a8">−</span>
                <span class="amount">100</span>
                <span style="color:#8e85a8">+</span>
            </div>
            <div class="quick-bets">
                <button class="q-btn">1</button><button class="q-btn">2</button>
                <button class="q-btn">5</button><button class="q-btn">10</button>
            </div>
            <button class="bet-btn" id="btn1" onclick="handleBet(this)">Place Bet</button>
            <div class="auto-row">Auto play <input type="checkbox"></div>
        </div>

        <div class="bet-panel">
            <div class="input-group">
                <span style="color:#8e85a8">−</span>
                <span class="amount">100</span>
                <span style="color:#8e85a8">+</span>
            </div>
            <div class="quick-bets">
                <button class="q-btn">1</button><button class="q-btn">2</button>
                <button class="q-btn">5</button><button class="q-btn">10</button>
            </div>
            <button class="bet-btn" id="btn2" onclick="handleBet(this)">Place Bet</button>
            <div class="auto-row">Auto play <input type="checkbox"></div>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let running = false;
        let gameInterval;
        const display = document.getElementById('display');
        const plane = document.getElementById('plane');

        function handleBet(btn) {
            if (btn.innerText === "PLACE BET") {
                btn.innerText = "CASH OUT";
                btn.classList.add('cashout');
                if(!running) startGame();
            } else {
                alert("تە قازانج کر ل سەر: " + multiplier.toFixed(2) + "x");
                resetGame(btn);
            }
        }

        function startGame() {
            running = true;
            multiplier = 1.00;
            display.style.color = "white";
            
            gameInterval = setInterval(() => {
                multiplier += 0.01;
                display.innerText = multiplier.toFixed(2) + "x";
                
                // جووڵەیا فڕۆکەیێ بەرەڤ لایێ ڕاست و سەرێ
                let move = (multiplier - 1) * 35;
                plane.style.transform = `translate(${move}px, -${move}px)`;

                // ئەگەرێ فڕینێ (Crash)
                if (Math.random() < 0.006 && multiplier > 1.2) {
                    crash();
                }
            }, 100);
        }

        function crash() {
            clearInterval(gameInterval);
            running = false;
            display.style.color = "#ff3471";
            display.innerText = "FLEW AWAY!";
            setTimeout(() => {
                resetGame(document.getElementById('btn1'));
                resetGame(document.getElementById('btn2'));
            }, 2000);
        }

        function resetGame(btn) {
            btn.innerText = "PLACE BET";
            btn.classList.remove('cashout');
            multiplier = 1.00;
            display.innerText = "1.00x";
            display.style.color = "white";
            plane.style.transform = `translate(0, 0)`;
        }

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
