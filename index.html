<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Enterprise Pro</title>
    <script src="https://pixijs.download/v7.x/pixi.min.js"></script>
    <style>
        body { margin: 0; background: #0c0d12; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .multiplier { text-align: center; margin-top: 20%; color: white; font-size: 5rem; font-style: italic; text-shadow: 0 0 20px rgba(255,181,0,0.5); }
        .controls { height: 30vh; background: #0f111a; display: flex; justify-content: space-around; align-items: center; pointer-events: auto; border-top: 2px solid #232635; padding: 0 20px; }
        .bet-btn { background: linear-gradient(180deg, #2855f5, #1a3ab3); color: white; border: none; padding: 25px 50px; border-radius: 15px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 80%; }
        .bet-btn.active { background: linear-gradient(180deg, #ffb500, #e68a00); color: black; }
    </style>
</head>
<body>

<div id="game-container"></div>
<div id="ui">
    <div class="multiplier" id="m-display">1.00x</div>
    <div class="controls">
        <button class="bet-btn" id="main-btn" onclick="handleAction()">PLACE BET</button>
    </div>
</div>

<script>
    // 1. دروستکردنی بزوێنەری گرافیکی (Engine)
    const app = new PIXI.Application({
        width: window.innerWidth,
        height: window.innerHeight * 0.7,
        backgroundColor: 0x0c0d12,
        antialias: true
    });
    document.getElementById('game-container').appendChild(app.view);

    // 2. دروستکردنی ئەستێرەکانی باکگراوند (Starfield)
    const stars = [];
    for (let i = 0; i < 100; i++) {
        const star = new PIXI.Graphics();
        star.beginFill(0xFFFFFF, Math.random());
        star.drawCircle(0, 0, Math.random() * 2);
        star.x = Math.random() * app.screen.width;
        star.y = Math.random() * app.screen.height;
        app.stage.addChild(star);
        stars.push(star);
    }

    // 3. دروستکردنی فڕۆکەی "کۆمپانیایی" بە کۆدی گرافیکی
    const planeContainer = new PIXI.Container();
    const body = new PIXI.Graphics();
    body.beginFill(0xff3344).drawRoundedRect(0, 0, 70, 25, 10).endFill(); // لاشەی فڕۆکە
    const wing = new PIXI.Graphics();
    wing.beginFill(0xeeeeee).drawRect(20, -15, 10, 40).endFill(); // باڵەکان
    planeContainer.addChild(wing, body);
    planeContainer.pivot.set(35, 12);
    app.stage.addChild(planeContainer);

    const line = new PIXI.Graphics();
    app.stage.addChild(line);

    let multiplier = 1.00;
    let isFlying = false;

    function handleAction() {
        const btn = document.getElementById('main-btn');
        if (!isFlying) {
            isFlying = true; multiplier = 1.00;
            btn.innerText = "CASH OUT"; btn.classList.add('active');
            document.getElementById('m-display').style.color = "white";
        } else {
            alert("Win: " + (100 * multiplier).toFixed(2) + " TON");
            reset();
        }
    }

    function reset() {
        isFlying = false;
        const btn = document.getElementById('main-btn');
        btn.innerText = "PLACE BET"; btn.classList.remove('active');
        planeContainer.x = -100; // شاردنەوە
    }

    // 4. بزوێنەری ئەنیمەیشن (60 FPS)
    app.ticker.add((delta) => {
        // جوڵاندنی ئەستێرەکان (هەستی خێرایی)
        stars.forEach(s => {
            s.x -= isFlying ? 2 * multiplier : 0.5;
            if (s.x < 0) s.x = app.screen.width;
        });

        if (isFlying) {
            multiplier += 0.006;
            document.getElementById('m-display').innerText = multiplier.toFixed(2) + "x";

            // هاوکێشەی فڕینی کەوانەیی (وەک Aviatrix)
            let x = (multiplier - 1) * 250;
            let y = Math.pow(multiplier - 1, 1.3) * 200;
            
            planeContainer.x = 100 + x;
            planeContainer.y = app.screen.height - 100 - y;
            planeContainer.rotation = -Math.atan2(y, x) * 0.5; // سووڕانەوەی فڕۆکەکە بەرەو سەرەوە

            // کێشانی هێڵە زەردە پڕۆفیشناڵەکە
            line.clear();
            line.lineStyle(5, 0xffb500, 1);
            line.moveTo(100, app.screen.height - 100);
            line.quadraticCurveTo(planeContainer.x / 2 + 50, app.screen.height - 100, planeContainer.x, planeContainer.y);

            // لۆژیکی دۆڕان (Crash)
            if (Math.random() < 0.005 && multiplier > 1.2) {
                isFlying = false;
                document.getElementById('m-display').innerText = "FLEW AWAY!";
                document.getElementById('m-display').style.color = "#ff3366";
                setTimeout(() => reset(), 2000);
            }
        }
    });

    planeContainer.x = 100; planeContainer.y = app.screen.height - 100;
</script>

</body>
</html>
<style>
    .history-bar {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 5px;
        pointer-events: auto;
    }
    .hist-item {
        background: #1c1f2e;
        color: #ffb500;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        border: 1px solid #2d3045;
    }
</style>

<div class="history-bar" id="history-list">
    </div>

<script>
    // لۆژیکی زیادکردنی ئەنجامی خولەکان بۆ مێژوو
    function addToHistory(value) {
        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = 'hist-item';
        item.innerText = value.toFixed(2) + "x";
        
        // ڕەنگی جیاواز بۆ ئەنجامەکان
        if(value < 2) item.style.color = "#ff3366";
        else if(value >= 10) item.style.color = "#9d50bb";
        
        list.prepend(item);
        if(list.children.length > 8) list.lastChild.remove();
    }
</script>//
