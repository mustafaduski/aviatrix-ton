<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Mobile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .game-header { padding: 15px; display: flex; justify-content: space-between; background: #151724; }
        .game-area { flex: 1; background: linear-gradient(to bottom, #1a1c2c, #4a1942); position: relative; display: flex; align-items: center; justify-content: center; }
        .multiplier { font-size: 4rem; font-weight: 900; z-index: 10; text-shadow: 0 0 20px #a020f0; }
        .plane-box { position: absolute; bottom: 20%; left: 10%; transition: all 0.1s linear; }
        .plane-svg { width: 80px; filter: drop-shadow(0 0 10px #a020f0); }
        .controls { background: #151724; padding: 30px 20px; border-radius: 25px 25px 0 0; }
        .bet-btn { width: 100%; background: #02c076; color: white; border: none; padding: 20px; border-radius: 15px; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-header">
        <div id="ton-connect-button"></div>
        <div style="color: #00d2ff;">Aviatrix Pro</div>
    </div>
    <div class="game-area">
        <div class="multiplier" id="m-val">1.00x</div>
        <div class="plane-box" id="plane">
            <svg class="plane-svg" viewBox="0 0 64 64"><path d="M62,32c0-1.1-0.9-2-2-2H44.7L31,10H24l7,20h-9l-4-6h-6l2,6l-2,6h6l4-6h9l-7,20h7l13.7-20H60C61.1,34,62,33.1,62,32z" fill="#a020f0"/></svg>
        </div>
    </div>
    <div class="controls">
        <button class="bet-btn" onclick="startFlight()">BET</button>
    </div>

    <script>
        // Start TonConnect
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://mustafaduski.github.io/aviatrix-ton/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        let m = 1.00;
        let isFlying = false;

        function startFlight() {
            if(!tonConnectUI.wallet) {
                window.Telegram.WebApp.showAlert("تکایە بەری هەمی تشتان وەلێتێ خۆ Connect بکە!");
                return;
            }
            isFlying = true; // فڕۆکە دەست ب فڕینێ دکەت
            window.Telegram.WebApp.showAlert("Bet Started!");
        }

        function gameLoop() {
            if(isFlying) {
                m += 0.01;
                document.getElementById('m-val').innerText = m.toFixed(2) + "x";
                let p = document.getElementById('plane');
                p.style.left = (10 + Math.min((m-1)*40, 70)) + "%";
                p.style.bottom = (20 + Math.min((m-1)*20, 50)) + "%";
            }
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
