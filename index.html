<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Ultra Pro</title>
    <style>
        :root { --main-blue: #2855f5; --bg-dark: #0c0d12; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }

        /* ئاسمان و هەورەکان */
        .game-area { 
            position: relative; height: 65vh; 
            background: linear-gradient(to bottom, #1e3c72, #2a5298); 
            overflow: hidden; border-bottom: 2px solid #232635;
        }
        .clouds {
            position: absolute; width: 200%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/clouds.png');
            animation: moveClouds 20s linear infinite; opacity: 0.5;
        }
        @keyframes moveClouds { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .multiplier { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 5rem; font-weight: 900; z-index: 10; font-style: italic;
        }

        /* فڕۆکە و هێڵەکە */
        .plane { 
            position: absolute; bottom: 20%; left: 10%; width: 130px; z-index: 5;
            transition: transform 0.1s linear;
        }
        .flight-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
        }

        /* پەنەلی گرەو وەک وێنە ئەسڵییەکە */
        .bet-panel { 
            height: 35vh; background: #0f111a; padding: 15px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .bet-card { 
            background: #1c1f2e; border-radius: 18px; padding: 15px; 
            border: 1px solid #2d3045; display: flex; flex-direction: column; justify-content: space-between;
        }
        .bet-btn { 
            background: linear-gradient(180deg, #2855f5, #1a3ab3); 
            border: none; color: white; padding: 16px; border-radius: 12px; 
            font-weight: 900; font-size: 1.2rem; cursor: pointer;
        }
        .bet-btn.cashout { background: linear-gradient(180deg, #ff9d00, #e68a00); color: black; }

        /* ئەنیمەیشنی فڕین بۆ دوور */
        .flew-away { 
            transition: 0.6s ease-in; transform: translate(600px, -400px) scale(0) !important; opacity: 0; 
        }
    </style>
</head>
<body>

    <div class="game-area">
        <div class="clouds"></div>
        <div class="multiplier" id="m-text">1.00x</div>
        
        <svg class="flight-line">
            <path id="path-line" d="M 0 500 Q 0 500 0 500" fill="none" stroke="#ffb500" stroke-width="5" />
        </svg>

        <div class="plane" id="plane-obj">
            <img src="https://raw.githubusercontent.com/fbeeper/fbeeper.github.io/master/aviator-plane.png" width="100%">
        </div>
    </div>

    <div class="bet-panel">
        <div class="bet-card">
            <div style="text-align:center; font-size: 1.4rem; color: #ffb500;">100</div>
            <button class="bet-btn" onclick="startBet(this)">PLACE BET</button>
        </div>
        <div class="bet-card">
            <div style="text-align:center; font-size: 1.4rem; color: #ffb500;">100</div>
            <button class="bet-btn" onclick="startBet(this)">PLACE BET</button>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let isActive = false;
        let loop;

        function startBet(btn) {
            if (btn.innerText === "PLACE BET") {
                btn.innerText = "CASH OUT";
                btn.classList.add('cashout');
                if (!isActive) runGame();
            } else {
                alert("پیرۆزە! " + (100 * multiplier).toFixed(2) + "$ تە بردەوە.");
                resetGame();
            }
        }

        function runGame() {
            isActive = true; multiplier = 1.00;
            const plane = document.getElementById('plane-obj');
            const path = document.getElementById('path-line');
            const h = document.querySelector('.game-area').offsetHeight;

            loop = setInterval(() => {
                multiplier += 0.01;
                document.getElementById('m-text').innerText = multiplier.toFixed(2) + "x";
                
                let x = (multiplier - 1) * 50;
                let y = (multiplier - 1) * 40;
                
                plane.style.transform = `translate(${x}px, -${y}px)`;
                path.setAttribute('d', `M 0 ${h*0.8} Q ${x} ${h*0.8} ${x+50} ${h*0.8 - y}`);

                if (Math.random() < 0.006 && multiplier > 1.3) crash();
            }, 100);
        }

        function crash() {
            clearInterval(loop);
            isActive = false;
            document.getElementById('m-text').innerText = "FLEW AWAY!";
            document.getElementById('plane-obj').classList.add('flew-away');
            setTimeout(() => { location.reload(); }, 2000);
        }

        function resetGame() {
            document.querySelectorAll('.bet-btn').forEach(b => {
                b.innerText = "PLACE BET";
                b.classList.remove('cashout');
            });
        }
    </script>
</body>
</html>
