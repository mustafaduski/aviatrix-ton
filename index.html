<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Animated Pro</title>
    <style>
        :root { --bg-sky: #87ceeb; --panel-dark: #1c1f2e; }
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }

        /* شاشەی فڕین بە ئەنیمەیشنی هەور */
        .viewport { 
            position: relative; height: 60vh; 
            background: linear-gradient(to bottom, #4a90e2, #87ceeb); 
            overflow: hidden; 
        }

        /* ئەنیمەیشنی هەورەکان لە پاشبنەما */
        .cloud-layer {
            position: absolute; width: 200%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/clouds.png');
            animation: moveClouds 15s linear infinite;
            opacity: 0.6;
        }

        @keyframes moveClouds {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .multiplier { 
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 5rem; font-weight: 900; z-index: 10; font-style: italic;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* ئەنیمەیشنی فڕۆکە (لەرینەوەی سروشتی) */
        .plane { 
            position: absolute; bottom: 20%; left: 10%; width: 140px; z-index: 5;
            animation: planeHover 2s ease-in-out infinite;
        }

        @keyframes planeHover {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        /* هێڵی فڕین (Line) */
        .flight-path {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        /* دیزاینی دوگمەکان وەک وێنە ئەسڵییەکە */
        .controls { 
            height: 40vh; background: #0f111a; padding: 15px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .bet-card { 
            background: var(--panel-dark); border-radius: 20px; padding: 15px; 
            border: 1px solid #2d3045; display: flex; flex-direction: column; justify-content: space-between;
        }
        .bet-btn { 
            background: linear-gradient(180deg, #2855f5, #1a3ab3); 
            border: none; color: white; padding: 18px; border-radius: 15px; 
            font-weight: 900; font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .bet-btn.active { background: #ff9d00; color: black; box-shadow: 0 0 20px #ff9d00; }
        
        .crash-anim { animation: flyOut 0.5s forwards; }
        @keyframes flyOut { to { transform: translate(500px, -500px) scale(0.5); opacity: 0; } }
    </style>
</head>
<body>

    <div class="viewport">
        <div class="cloud-layer"></div>
        <div class="multiplier" id="m-val">1.00x</div>
        
        <svg class="flight-path">
            <path id="curve" d="M 0 500 Q 50 500 50 500" fill="none" stroke="#ffcc00" stroke-width="6" stroke-linecap="round" />
        </svg>

        <div class="plane" id="plane-box">
            <img src="https://raw.githubusercontent.com/fbeeper/fbeeper.github.io/master/aviator-plane.png" width="100%">
        </div>
    </div>

    <div class="controls">
        <div class="bet-card">
            <div style="text-align:center; font-size: 1.5rem; font-weight: bold; color: #ffcc00;">100</div>
            <button class="bet-btn" onclick="bet(this)">PLACE BET</button>
        </div>
        <div class="bet-card">
            <div style="text-align:center; font-size: 1.5rem; font-weight: bold; color: #ffcc00;">100</div>
            <button class="bet-btn" onclick="bet(this)">PLACE BET</button>
        </div>
    </div>

    <script>
        let m = 1.00;
        let isFlying = false;
        let loop;

        function bet(btn) {
            if (btn.innerText === "PLACE BET") {
                btn.innerText = "CASH OUT";
                btn.classList.add('active');
                if (!isFlying) start();
            } else {
                alert("تە " + (100 * m).toFixed(2) + "$ قازانج کرد!");
                reset(btn);
            }
        }

        function start() {
            isFlying = true; m = 1.00;
            const plane = document.getElementById('plane-box');
            const curve = document.getElementById('curve');
            plane.classList.remove('crash-anim');
            plane.style.opacity = "1";

            loop = setInterval(() => {
                m += 0.01;
                document.getElementById('m-val').innerText = m.toFixed(2) + "x";
                
                // جوڵەی فڕۆکە بەرەو سەرەوە بە ئەنیمەیشن
                let x = (m - 1) * 50;
                let y = (m - 1) * 40;
                plane.style.left = (10 + x/5) + "%";
                plane.style.bottom = (20 + y/5) + "%";

                // نوێکردنەوەی هێڵە زەردەکە
                curve.setAttribute('d', `M 0 500 Q ${x*2} 500 ${x*5} ${500 - y*5}`);

                if (Math.random() < 0.007 && m > 1.3) stop();
            }, 100);
        }

        function stop() {
            clearInterval(loop);
            isFlying = false;
            document.getElementById('m-val').innerText = "FLEW AWAY!";
            document.getElementById('plane-box').classList.add('crash-anim');
            
            setTimeout(() => {
                location.reload(); 
            }, 2000);
        }

        function reset(btn) {
            btn.innerText = "PLACE BET";
            btn.classList.remove('active');
        }
    </script>
</body>
</html>
