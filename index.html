<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Pro - TON</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e11;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 90%;
            max-width: 400px;
            background: #161a1e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,210,255,0.2);
        }
        .balance {
            color: #00d2ff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .multiplier {
            font-size: 4rem;
            font-weight: bold;
            margin: 30px 0;
            color: #ffffff;
        }
        .plane-box {
            height: 100px;
            position: relative;
        }
        #plane {
            width: 80px;
            transition: transform 0.1s linear;
        }
        .bet-btn {
            background-color: #02c076;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .bet-btn:active { transform: scale(0.98); }
        .footer-info {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #848e9c;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="balance">Balance: <span id="balance">100.00</span> TON</div>
        
        <div class="multiplier" id="multiplier">1.00x</div>

        <div class="plane-box">
            <img id="plane" src="https://raw.githubusercontent.com/TelegramGameBot/assets/main/plane.png" alt="plane">
        </div>

        <button class="bet-btn" onclick="makeDeposit()">BET</button>

        <div class="footer-info">
            Official Deposit Address (TON):<br>
            <b style="color:#00d2ff; word-break: break-all;">UQAinxO5Eym0OB4mHquKX1UIpLeK9gdb6OuKrdZE6v63NgPH</b>
        </div>
    </div>

    <script>
        let multiplier = 1.00;
        let isRunning = true;

        // ئەنیمەیشنا زیادبوونا ڕێژەیێ
        setInterval(() => {
            if(isRunning) {
                multiplier += 0.01;
                document.getElementById('multiplier').innerText = multiplier.toFixed(2) + "x";
                
                // لەرینا فڕۆکێ
                let offset = Math.sin(Date.now() / 200) * 5;
                document.getElementById('plane').style.transform = translateY(${offset}px);
            }
        }, 100);

        function makeDeposit() {
            const wallet = "UQAinxO5Eym0OB4mHquKX1UIpLeK9gdb6OuKrdZE6v63NgPH";
            alert("Please send your BET to:\n" + wallet);
        }

        // ئاگاداری بۆ تێلێگرامێ
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
