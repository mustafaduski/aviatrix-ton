<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Pro Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .game-area { flex: 1; background: linear-gradient(to bottom, #1a1c2c, #4a1942); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .multiplier { font-size: 5rem; font-weight: 900; z-index: 10; text-shadow: 0 0 25px #a020f0; transition: color 0.3s; }
        .crashed { color: #ff3e3e; text-shadow: 0 0 25px #ff3e3e; }
        .plane-box { position: absolute; bottom: 20%; left: 10%; transition: transform 0.1s linear; }
        .plane-svg { width: 100px; filter: drop-shadow(0 0 15px #a020f0); }
        .controls { background: #151724; padding: 30px 20px; border-radius: 30px 30px 0 0; }
        .bet-btn { width: 100%; background: #02c076; color: white; border: none; padding: 20px; border-radius: 15px; font-size: 1.8rem; font-weight: bold; box-shadow: 0 5px 0 #017a4b; }
        .bet-btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>
    <div class="game-area">
        <div class="multiplier" id="m-val">1.00x</div>
        <div class="plane-box" id="plane">
            <svg id="p-svg" class="plane-svg" viewBox="0 0 64 64"><path d="M62,32c0-1.1-0.9-2-2-2H44.7L31,10H24l7,20h-9l-4-6h-6l2,6l-2,6h6l4-6h9l-7,20h7l13.7-20H60C61.1,34,62,33.1,62,32z" fill="#a020f0"/></svg>
        </div>
    </div>
    <div class="controls">
        <button class="bet-btn" id="main-btn" onclick="handleAction()">BET</button>
    </div>

    <script>
        let m = 1.00;
        let isFlying = false;
        let crashPoint = 0;
        const mVal = document.getElementById('m-val');
        const plane = document.getElementById('plane');
        const btn = document.getElementById('main-btn');

        // دەنگێن یاریێ (ب شێوەیێ ئۆنلاین)
        const winSound = new Audio('https://www.soundjay.com/buttons/sounds/button-37.mp3');
        const crashSound = new Audio('https://www.soundjay.com/free-music/sounds/fail-farewell-01.mp3');

        function handleAction() {
            if(!isFlying) {
                startNewGame();
            } else {
                cashOut();
            }
        }

        function startNewGame() {
            m = 1.00;
            isFlying = true;
            mVal.classList.remove('crashed');
            mVal.innerText = "1.00x";
            // دیارکرنا کاتی تەقینێ ب شێوەیەکێ عەشوائی (ژ 1.1 هەتا 10.0)
            crashPoint = (Math.random() * 5 + 1.1).toFixed(2);
            btn.innerText = "CASH OUT";
            btn.style.background = "#d93025";
            btn.style.boxShadow = "0 5px 0 #a51d14";
        }

        function cashOut() {
            isFlying = false;
            winSound.play();
            window.Telegram.WebApp.showAlert("💰 تە قازانج کر! ڕێژە: " + m.toFixed(2) + "x");
            resetUI();
        }

        function resetUI() {
            isFlying = false;
            btn.innerText = "BET";
            btn.style.background = "#02c076";
            btn.style.boxShadow = "0 5px 0 #017a4b";
            plane.style.left = "10%";
            plane.style.bottom = "20%";
        }

        function loop() {
            if(isFlying) {
                m += 0.01;
                mVal.innerText = m.toFixed(2) + "x";

                if(m >= crashPoint) {
                    isFlying = false;
                    mVal.innerText = "FLEW AWAY!";
                    mVal.classList.add('crashed');
                    crashSound.play();
                    setTimeout(resetUI, 2000);
                }

                let x = Math.min((m-1)*40, 75);
                let y = Math.min((m-1)*20, 55);
                plane.style.left = (10 + x) + "%";
                plane.style.bottom = (20 + y) + "%";
                plane.style.transform = `translateY(${Math.sin(Date.now()/150)*5}px)`;
            }
            requestAnimationFrame(loop);
        }
        loop();

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
