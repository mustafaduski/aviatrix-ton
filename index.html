<!DOCTYPE html>
<html>
<head>
    <title>Aviatrix Pro - Game Engine</title>
    <script src="https://pixijs.download/v7.x/pixi.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0c0d12; overflow: hidden; font-family: 'Arial', sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .multiplier { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 80px; font-weight: 900; font-style: italic; }
        .bet-panel { position: absolute; bottom: 0; width: 100%; height: 30vh; background: #0f111a; display: flex; justify-content: space-around; align-items: center; pointer-events: auto; border-top: 2px solid #232635; }
        .btn-bet { background: #2855f5; color: white; border: none; padding: 20px 60px; border-radius: 15px; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-bet.active { background: #ffb500; color: black; }
    </style>
</head>
<body>

<div id="game-canvas"></div>
<div id="ui-layer">
    <div class="multiplier" id="m-display">1.00x</div>
    <div class="bet-panel">
        <button class="btn-bet" id="bet-btn" onclick="toggleBet()">PLACE BET</button>
    </div>
</div>

<script>
    // 1. ڕێکخستنی بزوێنەری PixiJS (وەک کۆمپانیا پڕۆفیشناڵەکان)
    const app = new PIXI.Application({
        width: window.innerWidth,
        height: window.innerHeight * 0.7,
        backgroundColor: 0x0c0d12,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
    });
    document.getElementById('game-canvas').appendChild(app.view);

    // 2. دروستکردنی هێڵی فڕین (Graphics)
    const line = new PIXI.Graphics();
    app.stage.addChild(line);

    // 3. دروستکردنی فڕۆکەکە بە کۆد (بۆ ئەوەی وێنە نەبێت و تێک نەچێت)
    const plane = new PIXI.Graphics();
    plane.beginFill(0xff3333);
    plane.drawRoundedRect(0, 0, 60, 25, 10);
    plane.endFill();
    app.stage.addChild(plane);

    let multiplier = 1.00;
    let isFlying = false;
    let speed = 0.005;

    function toggleBet() {
        const btn = document.getElementById('bet-btn');
        if (!isFlying) {
            isFlying = true;
            multiplier = 1.00;
            btn.innerText = "CASH OUT";
            btn.classList.add('active');
            fly();
        } else {
            alert("تە " + (100 * multiplier).toFixed(2) + " TON قازانج کرد!");
            resetGame();
        }
    }

    function fly() {
        if (!isFlying) return;

        app.ticker.add((delta) => {
            if (!isFlying) return;

            multiplier += speed;
            document.getElementById('m-display').innerText = multiplier.toFixed(2) + "x";

            // لۆژیکی دروستکردنی کێرڤ (Parabolic curve)
            let x = (multiplier - 1) * 200;
            let y = Math.pow(multiplier - 1, 1.3) * 150;

            plane.x = 100 + x;
            plane.y = app.screen.height - 100 - y;

            // کێشانی هێڵی زەردی دوای فڕۆکەکە
            line.clear();
            line.lineStyle(6, 0xffb500, 1);
            line.moveTo(100, app.screen.height - 100);
            line.quadraticCurveTo(plane.x / 2 + 50, app.screen.height - 100, plane.x, plane.y + 12);

            // لۆژیکی تەقینەوە (ڕێژەیی)
            if (Math.random() < 0.004 && multiplier > 1.3) {
                crash();
            }
        });
    }

    function crash() {
        isFlying = false;
        document.getElementById('m-display').innerText = "FLEW AWAY!";
        document.getElementById('m-display').style.color = "#ff3366";
        setTimeout(() => {
            location.reload();
        }, 2000);
    }

    function resetGame() {
        isFlying = false;
        const btn = document.getElementById('bet-btn');
        btn.innerText = "PLACE BET";
        btn.classList.remove('active');
    }
</script>

</body>
</html>
