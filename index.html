<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Pro - TON Connect</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .game-header { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #151724; }
        #ton-connect-button { scale: 0.8; } /* قەبارێ دوگمەیا وەلێتی */
        .game-area { flex-grow: 1; background: linear-gradient(to bottom, #1a1c2c, #4a1942); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .multiplier { font-size: 4.5rem; font-weight: 900; z-index: 10; text-shadow: 0 0 20px #a020f0; }
        .plane-container { position: absolute; bottom: 20%; left: 15%; transition: all 0.1s linear; }
        .plane-svg { width: 90px; filter: drop-shadow(0 0 15px #a020f0); }
        .controls { background: #151724; padding: 20px; border-radius: 20px 20px 0 0; }
        .bet-button { width: 100%; background: #02c076; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
        .bet-button:disabled { background: #32354a; cursor: not-allowed; }
        .status-text { text-align: center; font-size: 0.8rem; margin-top: 10px; color: #848e9c; }
    </style>
</head>
<body>
    <div class="game-header">
        <div id="ton-connect-button"></div> <div style="color: #00d2ff;">Aviatrix Pro</div>
    </div>

    <div class="game-area">
        <div class="multiplier" id="m-val">1.00x</div>
        <div class="plane-container" id="plane-box">
            <svg class="plane-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M62,32c0-1.1-0.9-2-2-2H44.7L31,10H24l7,20h-9l-4-6h-6l2,6l-2,6h6l4-6h9l-7,20h7l13.7-20H60C61.1,34,62,33.1,62,32z" fill="#a020f0"/></svg>
        </div>
    </div>

    <div class="controls">
        <button class="bet-button" id="bet-btn" onclick="handleBet()">BET</button>
        <div class="status-text" id="status">Please connect your wallet to play</div>
    </div>

    <script>
        // ١. دەستپێکرنا TON Connect
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://mustafaduski.github.io/aviatrix-ton/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // ٢. یاری (Multiplier)
        let m = 1.00;
        setInterval(() => {
            m += 0.01;
            document.getElementById('m-val').innerText = m.toFixed(2) + "x";
            let plane = document.getElementById('plane-box');
            plane.style.left = (15 + Math.min((m-1)*30, 60)) + "%";
            plane.style.bottom = (20 + Math.min((m-1)*15, 40)) + "%";
        }, 100);

        // ٣. کارکرنا دوگمەیا BET
        async function handleBet() {
            const connectedWallet = tonConnectUI.wallet;
            
            if (!connectedWallet) {
                window.Telegram.WebApp.showAlert("تکایە بەری هەمی تشتان وەلێتێ خۆ (Connect) بکە!");
                return;
            }

            // ئەگەر وەلێت یێ بەستى بیت، داخوازییا پارەی دکەت
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [
                    {
                        address: "UQAinxO5Eym0OB4mHquKX1UIpLeK9gdb6OuKrdZE6v63NgPH", // وەلێتێ تە
                        amount: "1000000000" // ئەڤە رامانا ١ تەن ددەت (ب نانۆ تەن)
                    }
                ]
            };

            try {
                await tonConnectUI.sendTransaction(transaction);
                window.Telegram.WebApp.showAlert("Bet Placed Successfully!");
            } catch (e) {
                console.error(e);
            }
        }

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
