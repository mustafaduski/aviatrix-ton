<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Ultra Galaxy</title>
    <style>
        body {
            margin: 0;
            background: #050505 url('https://wallpaperaccess.com/full/1209562.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-around;
            box-shadow: 0 2px 10px #ff0055;
        }

        #balance { color: #ffd700; font-weight: bold; font-size: 20px; }

        .game-area {
            position: relative;
            width: 100%;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #multiplier {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 0 0 15px #00d2ff;
            z-index: 10;
        }

        canvas { background: transparent; }

        .controls {
            width: 100%;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            text-align: center;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            width: 80px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .btn-bet {
            padding: 15px 60px;
            background: linear-gradient(45deg, #ff0055, #ff00aa);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
    </style>
</head>
<body>

<div class="header">
    <div>💰 Balance: $<span id="balanceVal">100.00</span></div>
    <div style="color: #00ffcc;">Aviatrix PRO</div>
</div>

<div class="game-area">
    <div id="multiplier">1.00x</div>
    <canvas id="gameCanvas"></canvas>
</div>

<div class="controls">
    <input type="number" id="betInput" value="10"> <br>
    <button class="btn-bet" id="mainBtn">BET</button>
</div>

<audio id="crashSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multiText = document.getElementById('multiplier');
    const balanceText = document.getElementById('balanceVal');
    const mainBtn = document.getElementById('mainBtn');
    const crashSound = document.getElementById('crashSound');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.6;

    let balance = 100.0;
    let multiplier = 1.0;
    let isPlaying = false;
    let planeX = 50, planeY = canvas.height - 50;

    // بارکردنا وێنەیێ فڕۆکێ
    const planeImg = new Image();
    planeImg.src = 'https://i.ibb.co/3pS9m8M/plane-red.png';

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isPlaying) {
            ctx.drawImage(planeImg, planeX, planeY, 60, 60);
            planeX += 2;
            planeY -= 1.5;
            
            if (planeX > canvas.width) planeX = 0;
            if (planeY < 0) planeY = canvas.height;
        }
        requestAnimationFrame(draw);
    }

    mainBtn.onclick = () => {
        if (!isPlaying) {
            let bet = parseFloat(document.getElementById('betInput').value);
            if (bet <= balance) {
                balance -= bet;
                balanceText.innerText = balance.toFixed(2);
                startGame();
            }
        } else {
            cashOut();
        }
    };

    function startGame() {
