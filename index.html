<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aviatrix Dashboard Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* شاشەیا فڕینێ */
        .game-screen { flex: 1.2; background: radial-gradient(circle at center, #1e213a 0%, #0c0d12 100%); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .history-bar { position: absolute; top: 10px; width: 90%; display: flex; gap: 5px; overflow: hidden; font-size: 0.7rem; opacity: 0.7; }
        .hist-item { background: #1c1f2e; padding: 2px 8px; border-radius: 10px; border: 1px solid #32354a; }
        
        .multiplier { font-size: 4.5rem; font-weight: 900; z-index: 10; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .plane-container { position: absolute; bottom: 20%; left: 10%; transition: all 0.1s linear; }
        .plane-img { width: 130px; filter: drop-shadow(0 0 15px #a020f0); }

        /* پشکا گرەوێ (Dashboard) */
        .dashboard { flex: 1.5; background: #151724; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 2px solid #2a2d3f; }
        .bet-card { background: #1c1f2e; border-radius: 15px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #2a2d3f; }
        .amount-display { background: #0c0d12; border-radius: 8px; padding: 10px; text-align: center; color: #ffb800; font-weight: bold; font-size: 1.2rem; }
        .quick-amounts { display: flex; justify-content: space-between; gap: 4px; }
        .q-btn { background: #2a2d3f; border: none; color: white; padding: 6px; border-radius: 5px; flex: 1; font-size: 0.7rem; }
        .place-bet-btn { background: #4d79ff; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 0 #2a4dbf; }
        .place-bet-btn.active { background: #ff4d4d; box-shadow: 0 4px 0 #bf2a2a; }
        
        .auto-play { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #848e9c; }
    </style>
</head>
<body>
    <div class="game-screen">
        <div class="history-bar">
            <div class="hist-item" style="color:#9c59ff">6.21</div>
            <div class="hist-item" style="color:#00d2ff">3.49</div>
            <div class="hist-item" style="color:#9c59ff">10.08</div>
            <div class="hist-item">1.32</div>
            <div class="hist-item">1.90</div>
        </div>
        <div class="multiplier" id="m-val">1.00x</div>
        <div class="plane-container" id="plane-box">
            <img class="plane-img" src="https://raw.githubusercontent.com/mustafaduski/aviatrix-ton/main/plane.png" onerror="this.src='https://svgshare.com/i/157u.svg'">
        </div>
    </div>

    <div class="dashboard">
        <div class="bet-card">
            <div class="amount-display">100</div>
            <div class="quick-amounts">
                <button class="q-btn">1</button>
                <button class="q-btn">2</button>
                <button class="q-btn">5</button>
                <button class="q-btn">100</button>
            </div>
            <button class="place-bet-btn" onclick="toggleBet(this)">PLACE BET</button>
            <div class="auto-play">Auto play <span>🔘</span></div>
        </div>

        <div class="bet-card">
            <div class="amount-display">100</div>
            <div class="quick-amounts">
                <button class="q-btn">1</button>
                <button class="q-btn">2</button>
                <button class="q-btn">5</button>
                <button class="q-btn">100</button>
            </div>
            <button class="place-bet-btn" onclick="toggleBet(this)">PLACE BET</button>
            <div class="auto-play">Auto play <span>🔘</span></div>
        </div>
    </div>

    <script>
        let m = 1.00;
        let isFlying = false;

        function toggleBet(btn) {
            if (btn.innerText === "PLACE BET") {
                btn.innerText = "CASH OUT";
                btn.classList.add('active');
                isFlying = true;
            } else {
                window.Telegram.WebApp.showAlert("تە قازانج کر: " + m.toFixed(2) + "x");
                btn.innerText = "PLACE BET";
                btn.classList.remove('active');
                isFlying = false;
                m = 1.00;
                document.getElementById('m-val').innerText = "1.00x";
            }
        }

        function loop() {
            if(isFlying) {
                m += 0.01;
                document.getElementById('m-val').innerText = m.toFixed(2) + "x";
                let p = document.getElementById('plane-box');
                p.style.left = (10 + Math.min((m-1)*40, 70)) + "%";
                p.style.bottom = (20 + Math.min((m-1)*20, 55)) + "%";
            }
            requestAnimationFrame(loop);
        }
        loop();

        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
