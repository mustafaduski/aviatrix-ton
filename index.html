<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Ultra</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* جهێ یاریێ - مەزنتر لێ هاتییە کرن */
        .game-area { 
            flex: 1; 
            background: radial-gradient(circle, #1a1c2c 0%, #0c0d12 100%); 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }

        /* ڕێژە (Multiplier) - گەلەک مەزن و گەش */
        .multiplier { 
            font-size: 6rem; 
            font-weight: 900; 
            z-index: 10; 
            color: #ffffff;
            text-shadow: 0 0 30px #a020f0, 0 0 10px #00d2ff; 
        }

        /* فڕۆکە - قەبارێ وێ مەزنتر بوویە */
        .plane-box { 
            position: absolute; 
            bottom: 25%; 
            left: 15%; 
            transition: transform 0.1s linear; 
            z-index: 20;
        }

        .plane-svg { 
            width: 140px; /* مەزنتر لێ هات */
            filter: drop-shadow(0 0 20px #a020f0); 
        }

        /* پشکا کۆنترۆڵێ */
        .controls { 
            background: #151724; 
            padding: 30px 20px; 
            border-top: 4px solid #32354a;
        }

        .bet-btn { 
            width: 100%; 
            background: #02c076; 
            color: white; 
            border: none; 
            padding: 25px; 
            border-radius: 20px; 
            font-size: 2rem; 
            font-weight: bold; 
            box-shadow: 0 6px 0 #017a4b; 
        }

        .bet-btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>
    <div class="game-area">
        <div class="multiplier" id="m-val">1.00x</div>
        <div class="plane-box" id="plane">
            <svg class="plane-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <path d="M62,32c0-1.1-0.9-2-2-2H44.7L31,10H24l7,20h-9l-4-6h-6l2,6l-2,6h6l4-6h9l-7,20h7l13.7-20H60C61.1,34,62,33.1,62,32z" fill="#a020f0"/>
            </svg>
        </div>
    </div>
    <div class="controls">
        <button class="bet-btn" id="main-btn" onclick="startGame()">BET</button>
    </div>

    <script>
        let m = 1.00;
        let isFlying = false;
        const mVal = document.getElementById('m-val');
        const plane = document.getElementById('plane');
        const btn = document.getElementById('main-btn');

        function startGame() {
            if(!isFlying) {
                isFlying = true;
                btn.innerText = "CASH OUT";
                btn.style.background = "#d93025";
            } else {
                window.Telegram.WebApp.showAlert("تە قازانج کر: " + m.toFixed(2) + "x");
                resetGame();
            }
        }

        function resetGame() {
            isFlying = false;
            m = 1.00;
            mVal.innerText = "1.00x";
            plane.style.left = "15%";
            plane.style.bottom = "25%";
            btn.innerText = "BET";
            btn.style.background = "#02c076";
        }

        function loop() {
            if(isFlying) {
                m += 0.01;
                mVal.innerText = m.toFixed(2) + "x";
                
                // لێرە فڕۆکە بەرەو سەرێ دچیت
                let x = Math.min((m-1)*35, 65);
                let y = Math.min((m-1)*20, 45);
                plane.style.left = (15 + x) + "%";
                plane.style.bottom = (25 + y) + "%";
                
                // لەرینا فڕۆکێ
                plane.style.transform = `translateY(${Math.sin(Date.now()/150)*6}px)`;
            }
            requestAnimationFrame(loop);
        }
        loop();

        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
