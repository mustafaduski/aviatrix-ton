<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Real Clone</title>
    <style>
        :root { --bg-color: #0c0d12; --panel-color: #1c1f2e; --accent: #2855f5; }
        body { margin: 0; background: var(--bg-color); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        /* شاشەی لۆدینگ ڕێک وەک وێنەکە */
        #loader { position: fixed; inset: 0; background: #0c0d12; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bar-bg { width: 250px; height: 4px; background: #2a2d3d; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4d4d, #ff9d00); transition: 0.1s; }

        /* بەشی سەرەوە (History) */
        .history-bar { height: 40px; background: #141520; display: flex; gap: 8px; padding: 5px 10px; overflow: hidden; align-items: center; }
        .h-item { background: #212435; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; color: #9758ff; }

        /* شاشەی فڕین */
        .viewport { position: relative; height: 50vh; background: #0c0d12; border-bottom: 2px solid #232635; display: flex; align-items: center; justify-content: center; }
        .multiplier { font-size: 5rem; font-weight: 900; z-index: 10; font-style: italic; }
        .plane { position: absolute; bottom: 15%; left: 10%; width: 130px; z-index: 5; }
        
        /* گرافیکی خوارەوە (Line) */
        .chart-line { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* دوگمەکان */
        .bet-area { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .bet-card { background: var(--panel-color); border-radius: 15px; padding: 15px; border: 1px solid #2d3045; }
        .bet-btn { width: 100%; height: 60px; border-radius: 12px; border: none; background: var(--accent); color: white; font-size: 1.2rem; font-weight: 900; cursor: pointer; }
        .bet-btn.active { background: #ff9d00; color: black; }
    </style>
</head>
<body>

    <div id="loader">
        <h2 style="font-style: italic;">AVIATRIX</h2>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <div class="history-bar">
        <div class="h-item">1.54x</div><div class="h-item" style="color:#34b3ff">2.10x</div><div class="h-item">1.02x</div>
    </div>

    <div class="viewport">
        <div class="multiplier" id="mult">1.00x</div>
        <img src="https://raw.githubusercontent.com/fbeeper/fbeeper.github.io/master/aviator-plane.png" id="plane" class="plane">
    </div>

    <div class="bet-area">
        <div class="bet-card">
            <button class="bet-btn" onclick="startBet(this)">PLACE BET</button>
        </div>
        <div class="bet-card">
            <button class="bet-btn" onclick="startBet(this)">PLACE BET</button>
        </div>
    </div>

    <script>
        // لۆدینگ
        let p = 0;
        let l = setInterval(() => {
            p += 2; document.getElementById('bar-fill').style.width = p + "%";
            if(p >= 100) { clearInterval(l); document.getElementById('loader').style.display='none'; }
        }, 50);

        // یاری
        let m = 1.00; let flying = false;
        function startBet(btn) {
            if(btn.innerText === "PLACE BET") {
                btn.innerText = "CASH OUT"; btn.classList.add('active');
                if(!flying) {
                    flying = true;
                    let run = setInterval(() => {
                        m += 0.01; document.getElementById('mult').innerText = m.toFixed(2) + "x";
                        document.getElementById('plane').style.transform = `translate(${(m-1)*40}px, -${(m-1)*30}px)`;
                        if(Math.random() < 0.007 && m > 1.2) {
                            clearInterval(run); flying = false; 
                            document.getElementById('mult').innerText = "FLEW AWAY";
                            setTimeout(() => { location.reload(); }, 2000);
                        }
                    }, 100);
                }
            }
        }
    </script>
</body>
</html>
