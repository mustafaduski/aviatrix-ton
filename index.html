<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Pro</title>
    <style>
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }
        #game-area { position: relative; height: 60vh; background: radial-gradient(circle at bottom left, #1e213a, #0c0d12); }
        canvas { width: 100%; height: 100%; display: block; }
        .mult { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 900; font-style: italic; }
        .controls { height: 40vh; background: #0f111a; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .bet-card { background: #1c1f2e; border-radius: 18px; padding: 15px; border: 1px solid #2d3045; text-align: center; }
        .btn { width: 100%; background: #2855f5; border: none; color: white; padding: 15px; border-radius: 12px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-top: 10px; }
        .btn.active { background: #ffb500; color: black; }
    </style>
</head>
<body>
    <div id="game-area">
        <canvas id="canvas"></canvas>
        <div class="mult" id="m-val">1.00x</div>
    </div>
    <div class="controls">
        <div class="bet-card"><div>100 TON</div><button class="btn" onclick="bet(this)">PLACE BET</button></div>
        <div class="bet-card"><div>100 TON</div><button class="btn" onclick="bet(this)">PLACE BET</button></div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let m = 1.00, flying = false;

        function resize() { canvas.width = window.innerWidth; canvas.height = canvas.offsetHeight; }
        window.onresize = resize; resize();

        function bet(b) {
            if(b.innerText === "PLACE BET") {
                b.innerText = "CASH OUT"; b.classList.add('active');
                if(!flying) { flying = true; m = 1.00; update(); }
            } else { b.innerText = "PLACE BET"; b.classList.remove('active'); }
        }

        function update() {
            if(!flying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            m += 0.01;
            document.getElementById('m-val').innerText = m.toFixed(2) + "x";
            
            let x = (m-1)*150, y = Math.pow(m-1, 1.2)*100;
            let px = 50 + x, py = canvas.height - 50 - y;

            // کێشانی هێڵی زەرد
            ctx.beginPath(); ctx.strokeStyle = '#ffb500'; ctx.lineWidth = 5;
            ctx.moveTo(50, canvas.height-50); ctx.quadraticCurveTo(px/2+25, canvas.height-50, px, py); ctx.stroke();

            // کێشانی فڕۆکە بە کۆد (نەک وێنە) بۆ ئەوەی لۆدینگ نەکات
            ctx.fillStyle = "red"; ctx.fillRect(px-20, py-10, 40, 20);

            if(Math.random() < 0.006 && m > 1.2) {
                flying = false; document.getElementById('m-val').innerText = "FLEW AWAY";
                setTimeout(() => location.reload(), 2000);
            } else requestAnimationFrame(update);
        }
    </script>
</body>
</html>
