<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #0c0d12; color: white; font-family: sans-serif; overflow: hidden; }
        .game-area { height: 60vh; background: linear-gradient(to bottom, #1a1c2c, #4a1942); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .multiplier { font-size: 5rem; font-weight: 800; z-index: 10; text-shadow: 0 0 20px rgba(160, 32, 240, 0.8); }
        .plane-container { position: absolute; bottom: 20%; left: 10%; transition: all 0.1s linear; }
        #plane-img { width: 120px; filter: drop-shadow(0 0 10px #a020f0); }
        .controls { height: 40vh; background: #151724; padding: 20px; border-top: 2px solid #32354a; }
        .bet-input { width: 100%; background: #0c0d12; border: 1px solid #32354a; color: #00d2ff; padding: 15px; border-radius: 8px; font-size: 1.2rem; text-align: center; margin-bottom: 15px; }
        .bet-button { width: 100%; background: #a020f0; color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; box-shadow: 0 5px 0 #6a14a1; }
        .bet-button:active { transform: translateY(3px); box-shadow: 0 2px 0 #6a14a1; }
        .wallet-info { font-size: 0.7rem; color: #6e7191; margin-top: 15px; text-align: center; }
        /* ئەنیمەیشنا پاشبنەما ئەور یان تیشک */
        .stars { position: absolute; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.3; }
    </style>
</head>
<body>
    <div class="game-area">
        <div class="stars"></div>
        <div class="multiplier" id="m-val">1.00x</div>
        <div class="plane-container" id="plane-box">
            <img id="plane-img" src="https://raw.githubusercontent.com/mustafaduski/aviatrix-ton/main/plane.png" onerror="this.src='https://svgshare.com/i/157u.svg'">
        </div>
    </div>
    <div class="controls">
        <input type="number" class="bet-input" value="1.0" step="0.1">
        <button class="bet-button" onclick="betNow()">BET</button>
        <div class="wallet-info">
            Deposit to: <br>
            <span style="color: #a020f0;">UQAinxO5Eym0OB4mHquKX1UIpLeK9gdb6OuKrdZE6v63NgPH</span>
        </div>
    </div>

    <script>
        let m = 1.00;
        let plane = document.getElementById('plane-box');
        let mVal = document.getElementById('m-val');

        function gameLoop() {
            m += 0.01;
            mVal.innerText = m.toFixed(2) + "x";
            
            // جوولەیا فڕۆکێ بەرەو سەرێ (Aviatrix Style)
            let x = (m - 1) * 30;
            let y = (m - 1) * 15;
            if(x < 60) {
                plane.style.left = (10 + x) + "%";
                plane.style.bottom = (20 + y) + "%";
            }
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        function betNow() {
            window.Telegram.WebApp.showAlert("Please send TON to the wallet address below to confirm your bet.");
        }
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
