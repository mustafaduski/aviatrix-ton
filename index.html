<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviatrix Fixed Edition</title>
    <style>
        :root { --bg: #0c0d12; --accent: #2855f5; --gold: #ffb500; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        /* چاککردنی سیستەمی لۆدکردن */
        #loader-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        .loading-circle { width: 40px; height: 40px; border: 4px solid #222; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* شاشەی یاری پڕۆفیشناڵ */
        #game-area { position: relative; height: 60vh; background: radial-gradient(circle at bottom left, #1e213a, #0c0d12); }
        canvas { width: 100%; height: 100%; display: block; }
        .multiplier { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 900; font-style: italic; text-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* پەنەلی گرەو وەک وێنە ئەسڵییەکە */
        .controls { height: 40vh; background: #0f111a; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid #232635; }
        .bet-card { background: #1c1f2e; border-radius: 18px; padding: 15px; border: 1px solid #2d3045; text-align: center; }
        .btn-play { width: 100%; background: linear-gradient(180deg, var(--accent), #1a3ab3); border: none; color: white; padding: 15px; border-radius: 12px; font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-top: 10px; }
        .btn-play.active { background: linear-gradient(180deg, var(--gold), #e68a00); color: black; }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="loading-circle"></div>
        <p>Aviatrix Loading...</p>
    </div>

    <div id="game-area">
        <canvas id="mainCanvas"></canvas>
        <div class="multiplier" id="m-text">1.00x</div>
    </div>

    <div class="controls">
        <div class="bet-card">
            <div style="color:var(--gold); font-weight:bold; font-size: 1.4rem;">100 TON</div>
            <button class="btn-play" onclick="handleAction(this)">PLACE BET</button>
        </div>
        <div class="bet-card">
            <div style="color:var(--gold); font-weight:bold; font-size: 1.4rem;">100 TON</div>
            <button class="btn-play" onclick="handleAction(this)">PLACE BET</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const mText = document.getElementById('m-text');
        let multiplier = 1.00;
        let active = false;
        const plane = new Image();

        // بەکارهێنانی وێنەیەکی جێگیر بۆ ئەوەی چیتر نیشانەی پرسیار (❓) دەرنەکەوێت
        plane.src = 'https://raw.githubusercontent.com/fbeeper/fbeeper.github.io/master/aviator-plane.png';
        
        plane.onload = () => {
            document.getElementById('loader-screen').style.display = 'none';
            resize();
            drawFrame();
        };

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        function handleAction(btn) {
            if (btn.innerText === "PLACE BET") {
                btn.innerText = "CASH OUT"; btn.classList.add('active');
                if (!active) start();
            } else {
                alert("پیرۆزە! تە " + (100 * multiplier).toFixed(2) + " TON قازانج کرت.");
                btn.innerText = "PLACE BET"; btn.classList.remove('active');
            }
        }

        function start() {
            active = true; multiplier = 1.00;
            requestAnimationFrame(update);
        }

        function update() {
            if (!active) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            multiplier += 0.006;
            mText.innerText = multiplier.toFixed(2) + "x";

            let x = (multiplier - 1) * 200;
            let y = Math.pow(multiplier - 1, 1.3) * 150;
            let pX = 80 + x;
            let pY = canvas.height - 100 - y;

            // کێشانی کێرڤی زەردی Aviatrix
            ctx.beginPath();
            ctx.strokeStyle = '#ffb500';
            ctx.lineWidth = 5;
            ctx.moveTo(80, canvas.height - 100);
            ctx.quadraticCurveTo(pX / 2 + 40, canvas.height - 100, pX, pY);
            ctx.stroke();

            // کێشانی فڕۆکەکە
            ctx.drawImage(plane, pX - 50, pY - 30, 110, 65);

            if (Math.random() < 0.006 && multiplier > 1.3) {
                active = false;
                mText.innerText = "FLEW AWAY!";
                setTimeout(() => location.reload(), 2000);
            } else {
                requestAnimationFrame(update);
            }
        }

        function drawFrame() {
            ctx.drawImage(plane, 80, canvas.height - 100, 110, 65);
        }
    </script>
</body>
</html>
